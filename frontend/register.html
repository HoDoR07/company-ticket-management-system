<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Company Ticket System</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="brand">

                <h1>Company Ticket System</h1>

                <p>
                    Create your company support account.
                </p>

            </div>


            <div class="auth-header">

                <h2>Create Account</h2>

                <p>
                    Register to start managing support tickets.
                </p>

            </div>


            <form id="registerForm">


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        maxlength="100"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter 10 digit phone number"
                        maxlength="10"
                        minlength="10"
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimum 8 characters"
                        minlength="8"
                        maxlength="20"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Create Account
                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="/login-page">
                    Sign In
                </a>

            </p>


            <a
                href="/"
                class="back-link"
            >
                ← Back to Home
            </a>

        </section>

    </main>


    <script src="/static/script.js"></script>

</body>

</html>
