<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Technician Dashboard | Company Ticket System</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="dashboard-header">

        <div>
            <h1>Technician Dashboard</h1>

            <p>
                Manage and resolve your assigned support tickets
            </p>
        </div>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </header>



    <!-- =========================
         MAIN DASHBOARD
    ========================== -->

    <main class="dashboard-container">


        <!-- =========================
             ASSIGNED TICKETS
        ========================== -->

        <section class="dashboard-card">

            <div class="section-heading">

                <div>

                    <h2>Assigned Tickets</h2>

                    <p class="section-description">
                        Review tickets assigned to you and update their status.
                    </p>

                </div>


                <button
                    class="secondary-btn"
                    onclick="loadTechnicianTickets()"
                >
                    Refresh
                </button>

            </div>


            <!-- TICKET LIST -->

            <div id="technicianTickets">

                <p>
                    Loading assigned tickets...
                </p>

            </div>

        </section>


    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="/static/script.js"></script>

</body>

</html>
