<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Company Ticket System</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="brand">

                <h1>Company Ticket System</h1>

                <p>
                    Manage and resolve support tickets efficiently.
                </p>

            </div>


            <div class="auth-header">

                <h2>Welcome Back</h2>

                <p>
                    Sign in to continue to your account.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Sign In
                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="/static/register.html">
                    Create an account
                </a>

            </p>


            <a
                href="/"
                class="back-link"
            >
                ← Back to Home
            </a>

        </section>

    </main>


    <script src="/static/script.js"></script>

</body>

</html>
